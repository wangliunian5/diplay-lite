name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Must stay on 17: Kotlin 1.8.22 crashes inside JavaVersion.parse on JDK 25
          # (see diplay-lite/gradle.properties). Do not bump casually.
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # compileSdk is 34 across the three modules and AGP 7.4.2 cannot target
          # newer platforms. No NDK here - the Opus JNI is built locally only.
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Source-only debug build
        # The modules that actually exist: :app :shared :blackbar. The old :common
        # and :mobile were removed when the tree collapsed into a single diplay-lite
        # project, and the repo has no unit tests, so compilation is the gate.
        run: ./gradlew :shared:assembleDebug :app:assembleDebug :blackbar:assembleDebug --stacktrace
